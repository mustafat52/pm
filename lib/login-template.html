<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hussaini Automations — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0a1424; font-family:'Inter',sans-serif; color:#f6f1e6;
    background-image:radial-gradient(50% 50% at 80% 10%, rgba(198,162,92,0.16), transparent 60%);
  }
  .card{
    width:100%; max-width:360px; padding:40px 34px; background:#0f1c30;
    border:1px solid rgba(198,162,92,0.25); border-radius:14px;
  }
  .mark{ width:34px; height:34px; margin-bottom:18px; }
  h1{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 6px; font-weight:600; }
  p.sub{ margin:0 0 28px; font-size:14px; color:rgba(246,241,230,0.55); }
  label{ display:block; font-size:13px; margin-bottom:8px; color:rgba(246,241,230,0.75); }
  input{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid rgba(198,162,92,0.3);
    background:#0a1424; color:#f6f1e6; font-size:15px;
  }
  input:focus{ outline:none; border-color:#c7a25c; }
  button{
    width:100%; margin-top:20px; padding:13px; border-radius:8px; border:none;
    background:#c7a25c; color:#0a1424; font-weight:600; font-size:14.5px; cursor:pointer;
    transition:background .2s;
  }
  button:hover{ background:#e3c17f; }
  button:disabled{ opacity:.6; cursor:default; }
  .err{ margin-top:14px; font-size:13px; color:#e08a6c; display:none; }
  .err.show{ display:block; }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 40 40" fill="none">
      <rect x="1" y="1" width="38" height="38" rx="9" stroke="#c7a25c" stroke-width="1.2"/>
      <path d="M12 12V28M12 20H22M22 12V28" stroke="#f6f1e6" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="28" cy="13" r="2.6" fill="#c7a25c"/>
    </svg>
    <h1>Project Manager</h1>
    <p class="sub">Sign in to add or update Hussaini Automations projects.</p>
    <form id="login-form">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" autofocus>
      <button type="submit" id="submit-btn">Sign In</button>
      <div class="err" id="err">Incorrect password. Try again.</div>
    </form>
  </div>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('err');
      const btn = document.getElementById('submit-btn');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (res.ok) {
          window.location.reload();
        } else {
          const data = await res.json().catch(() => ({}));
          errEl.textContent = data.error || 'Incorrect password. Try again.';
          errEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch (err) {
        errEl.textContent = 'Something went wrong. Try again.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
